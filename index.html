<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator || Java Script Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="main">

            <div class="head">
                <div class="headSvg">
                    <img src="cal.svg" alt="">
                    <h1>Calculator</h1>
                </div>
                <p>Do simple Calculation with ease</p>
            </div>

            <div class="display">
                
            </div>

            <div class="buttons">
                <button id="AC" class="red">AC</button>
                <button id="DEL" class="red">DEL</button>
                <button class="lightputPurple">%</button>
                <button class="lightputPurple">/</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="lightputPurple">*</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="lightputPurple">-</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button id="plus" class="lightputPurple">+</button>
                <button id="zero">0</button>
                <button>.</button>
                <button id="EQAL" class="equal">=</button>
            </div>

        </div>
    </div>
    <script src="script2.js"></script>
</body>

</html>
